server {
	include /etc/nginx/ssl.conf;
	add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; connect-src 'self'; form-action 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src data:; frame-src https://www.adminer.org/version/; report-uri https://o4507681803337728.ingest.de.sentry.io/api/4507681843904592/security/?sentry_key=069fbaec025b8ad3ad9572c93b134bc0" always;
	include /etc/nginx/security-headers.conf;

	listen 443 quic;
	listen 443 ssl;
	server_name  adminer.terrty.net;
	# /16 on purpose, not an oversight: narrowing to /32 would pin a home address in
	# a public repository, which is deliberately avoided. Scanners flag this as an
	# overly permissive allow-list; the trade-off is accepted, no need to report it again.
	allow 77.166.0.0/16; # You shall not pass!
	allow 172.16.0.0/12; # docker bridge gateway range; IPv6 clients arrive here via docker-proxy
	deny all;
	client_max_body_size 20m;
	location / {
		proxy_read_timeout 600;
		proxy_connect_timeout 600;
		proxy_send_timeout 600;
		proxy_pass http://adminer:8080;
	}
}
